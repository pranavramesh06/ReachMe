{% extends 'base.html' %}

{% block title %}Register Account - ReachMe{% endblock %}

{% block content %}
<section class="py-16">
    <div class="max-w-lg mx-auto px-4">
        <div class="glass-panel rounded-2xl p-8 border border-slate-700/80 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl gradient-bg mx-auto flex items-center justify-center text-white text-xl mb-3 shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white font-heading">Create ReachMe Account</h1>
                <p class="text-xs text-slate-400 mt-1">Join the data-driven telemedicine healthcare network</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Full Name</label>
                    <input type="text" name="full_name" required placeholder="Dr. Jane Doe / John Smith" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-teal-500">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Email Address</label>
                        <input type="email" name="email" required placeholder="user@example.com" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Phone Number</label>
                        <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Account Role</label>
                    <select name="role" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 text-sm focus:outline-none focus:border-teal-500">
                        <option value="PATIENT">Patient / Healthcare Seeker</option>
                        <option value="DOCTOR">Medical Practitioner / Doctor</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Password</label>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-heading">Confirm Password</label>
                        <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-slate-100 placeholder-slate-500 text-sm focus:outline-none focus:border-teal-500">
                    </div>
                </div>

                <button type="submit" class="w-full py-3 mt-2 rounded-xl font-bold text-white bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 shadow-lg shadow-teal-500/25 transition duration-200">
                    Register Account
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-slate-800 text-center text-xs text-slate-400">
                Already registered? 
                <a href="{{ url_for('auth.login') }}" class="font-semibold text-teal-400 hover:text-teal-300">Log In</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
