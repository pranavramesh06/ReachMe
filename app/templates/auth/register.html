{% extends 'base.html' %}

{% block title %}Register — ReachMe{% endblock %}

{% block content %}
<section class="py-16 sm:py-20">
    <div class="max-w-lg mx-auto px-4 sm:px-6">
        <div class="clean-card rounded-2xl p-8 sm:p-10 shadow-sm border border-slate-200/80">
            <div class="text-center mb-8">
                <div class="w-11 h-11 rounded-xl bg-teal-50 border border-teal-100 text-teal-700 mx-auto flex items-center justify-center text-lg mb-3">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Create an Account</h1>
                <p class="text-xs text-slate-500 mt-1">Join the data-driven telemedicine healthcare network</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1.5">Full Name</label>
                    <input type="text" name="full_name" required placeholder="Dr. Jane Doe / John Smith" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1.5">Email Address</label>
                        <input type="email" name="email" required placeholder="user@example.com" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1.5">Phone Number</label>
                        <input type="tel" name="phone" placeholder="+91 98765 43210" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                    </div>
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1.5">Account Role</label>
                    <select name="role" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                        <option value="PATIENT">Patient / Healthcare Seeker</option>
                        <option value="DOCTOR">Medical Practitioner / Doctor</option>
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1.5">Password</label>
                        <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1.5">Confirm Password</label>
                        <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                    </div>
                </div>

                <button type="submit" class="w-full py-2.5 mt-2 rounded-xl font-semibold text-white bg-teal-600 hover:bg-teal-700 shadow-sm transition">
                    Register Account
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
                Already registered? 
                <a href="{{ url_for('auth.login') }}" class="font-semibold text-teal-700 hover:text-teal-800">Log In</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
