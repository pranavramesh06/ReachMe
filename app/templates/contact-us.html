{% extends 'base.html' %}

{% block title %}Contact Us — ReachMe Support{% endblock %}

{% block content %}
<section class="py-16 sm:py-20">
    <div class="max-w-xl mx-auto px-4 sm:px-6">
        <div class="clean-card p-8 sm:p-10 rounded-2xl shadow-sm border border-slate-200/80">
            <div class="text-center mb-8">
                <div class="w-11 h-11 rounded-xl bg-teal-50 border border-teal-100 text-teal-700 mx-auto flex items-center justify-center text-lg mb-3">
                    <i class="fa-solid fa-headset"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">Get in Touch</h1>
                <p class="text-xs text-slate-500 mt-1">Send us an inquiry, feedback, or healthcare partnership request</p>
            </div>

            <form action="{{ url_for('main.contact_us') }}" method="POST" class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1.5">Full Name</label>
                    <input type="text" name="name" required placeholder="Enter your full name" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1.5">Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600">
                </div>

                <div>
                    <label class="block font-medium text-slate-700 mb-1.5">Message / Inquiry</label>
                    <textarea name="message" required rows="4" placeholder="How can our healthcare team assist you?" class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:border-teal-600 focus:ring-1 focus:ring-teal-600"></textarea>
                </div>

                <button type="submit" class="w-full py-2.5 mt-2 rounded-xl font-semibold text-white bg-teal-600 hover:bg-teal-700 shadow-sm transition">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
