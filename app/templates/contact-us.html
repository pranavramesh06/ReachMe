{% extends 'base.html' %}

{% block title %}Contact Us - ReachMe Support{% endblock %}

{% block content %}
<section class="py-16">
    <div class="max-w-xl mx-auto px-4">
        <div class="glass-panel p-8 rounded-2xl border border-slate-700/80 shadow-2xl">
            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-xl gradient-bg mx-auto flex items-center justify-center text-white text-xl mb-3 shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-headset"></i>
                </div>
                <h1 class="text-2xl font-extrabold text-white font-heading">Contact ReachMe Team</h1>
                <p class="text-xs text-slate-400 mt-1">Send us an inquiry or medical partnership request</p>
            </div>

            <form action="{{ url_for('main.contact_us') }}" method="POST" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1 font-heading">Full Name</label>
                    <input type="text" name="name" required placeholder="Enter your full name" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white">
                </div>

                <div>
                    <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1 font-heading">Email Address</label>
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white">
                </div>

                <div>
                    <label class="block font-semibold text-slate-300 uppercase tracking-wider mb-1 font-heading">Message / Inquiry</label>
                    <textarea name="message" required rows="4" placeholder="How can we assist you today?" class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-white"></textarea>
                </div>

                <button type="submit" class="w-full py-3 rounded-xl font-bold text-white bg-gradient-to-r from-teal-500 to-cyan-600 hover:from-teal-600 hover:to-cyan-700 shadow-lg shadow-teal-500/25 transition">
                    Send Message
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
