{% extends 'base.html' %}

{% block title %}403 Forbidden - ReachMe Access Denied{% endblock %}

{% block content %}
<section class="py-20 text-center">
    <div class="max-w-md mx-auto px-4">
        <div class="glass-panel p-8 rounded-2xl border border-rose-500/30">
            <h1 class="text-6xl font-extrabold font-heading text-rose-400 mb-2">403</h1>
            <h2 class="text-xl font-bold text-white font-heading mb-2">Access Forbidden</h2>
            <p class="text-xs text-slate-400 mb-6">
                You do not have the required role or authorization privileges to access this area.
            </p>
            <a href="{{ url_for('main.index') }}" class="px-6 py-2.5 rounded-xl font-semibold text-white bg-slate-800 hover:bg-slate-700 border border-slate-700 transition text-xs">
                Return to Safe Page
            </a>
        </div>
    </div>
</section>
{% endblock %}
