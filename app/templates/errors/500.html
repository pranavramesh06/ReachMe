{% extends 'base.html' %}

{% block title %}500 Internal Error - ReachMe{% endblock %}

{% block content %}
<section class="py-20 text-center">
    <div class="max-w-md mx-auto px-4">
        <div class="glass-panel p-8 rounded-2xl border border-amber-500/30">
            <h1 class="text-6xl font-extrabold font-heading text-amber-400 mb-2">500</h1>
            <h2 class="text-xl font-bold text-white font-heading mb-2">Internal Server Error</h2>
            <p class="text-xs text-slate-400 mb-6">
                An unexpected server exception occurred. The database transaction has been safely rolled back.
            </p>
            <a href="{{ url_for('main.index') }}" class="px-6 py-2.5 rounded-xl font-semibold text-white bg-teal-600 hover:bg-teal-500 transition text-xs">
                Return to Home Page
            </a>
        </div>
    </div>
</section>
{% endblock %}
